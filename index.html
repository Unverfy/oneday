<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDay - Генератор ідеального дня</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/@google/generative-ai@0.2.1/dist/index.min.js"></script>
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-sun" id="themeIcon"></i>
    </div>

    <!-- Settings Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Налаштування</h2>
            <button class="close-btn" id="closeSidebar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="menu-section">
            <h3>Акаунт</h3>
            <div class="account-options">
                <button class="account-btn">
                    <i class="fas fa-user"></i>
                    Профіль
                </button>
                <button class="account-btn">
                    <i class="fas fa-history"></i>
                    Історія планів
                </button>
                <button class="account-btn">
                    <i class="fas fa-heart"></i>
                    Улюблені місця
                </button>
            </div>
        </div>

        <div class="menu-section">
            <h3>Налаштування</h3>
            <div class="settings-options">
                <button class="settings-btn">
                    <i class="fas fa-bell"></i>
                    Сповіщення
                </button>
                <button class="settings-btn">
                    <i class="fas fa-language"></i>
                    Мова
                </button>
                <button class="settings-btn">
                    <i class="fas fa-map-marker-alt"></i>
                    Місцезнаходження
                </button>
                <button class="settings-btn">
                    <i class="fas fa-cog"></i>
                    Загальні налаштування
                </button>
            </div>
        </div>

        <div class="menu-section">
            <h3>Допомога</h3>
            <div class="help-options">
                <button class="help-btn">
                    <i class="fas fa-question-circle"></i>
                    FAQ
                </button>
                <button class="help-btn">
                    <i class="fas fa-envelope"></i>
                    Зв'язатися з нами
                </button>
                <button class="help-btn">
                    <i class="fas fa-info-circle"></i>
                    Про додаток
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Header -->
        <header class="header">
            <button class="settings-btn" id="settingsBtn">
                <i class="fas fa-cog"></i>
            </button>
            <h1>OneDay</h1>
            <p class="subtitle">Генератор ідеального дня для тебе</p>
        </header>

        <!-- Input Section -->
        <section class="input-section">
            <div class="input-container">
                <textarea 
                    id="userInput" 
                    placeholder="Опиши свій день: 'у мене вихідний / я в Києві / хочу розслабитися'"
                    rows="3"
                ></textarea>
                
                <!-- Options Row -->
                <div class="options-row">
                    <!-- Theme Dropdown -->
                    <div class="theme-dropdown-container">
                        <button class="theme-dropdown-btn" id="themeDropdownBtn">
                            <i class="fas fa-palette"></i>
                            <span id="selectedThemeText">Тема дня</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="theme-dropdown" id="themeDropdown">
                            <button class="theme-option" data-theme="relax">
                                <span class="theme-icon">🌅</span>
                                <span class="theme-text">Розслаблення</span>
                            </button>
                            <button class="theme-option" data-theme="productive">
                                <span class="theme-icon">⚡</span>
                                <span class="theme-text">Продуктивність</span>
                            </button>
                            <button class="theme-option" data-theme="romantic">
                                <span class="theme-icon">💕</span>
                                <span class="theme-text">Романтика</span>
                            </button>
                            <button class="theme-option" data-theme="adventure">
                                <span class="theme-icon">🗺️</span>
                                <span class="theme-text">Пригоди</span>
                            </button>
                            <button class="theme-option" data-theme="detox">
                                <span class="theme-icon">📱</span>
                                <span class="theme-text">Цифровий детокс</span>
                            </button>
                            <button class="theme-option" data-theme="cultural">
                                <span class="theme-icon">🎭</span>
                                <span class="theme-text">Культура</span>
                            </button>
                        </div>
                    </div>

                    <!-- Day Type Dropdown -->
                    <div class="day-type-dropdown-container">
                        <button class="day-type-dropdown-btn" id="dayTypeDropdownBtn">
                            <i class="fas fa-calendar"></i>
                            <span id="selectedDayTypeText">Тип дня</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="day-type-dropdown" id="dayTypeDropdown">
                            <button class="day-type-option" data-type="weekend">
                                <span class="day-type-icon">🎉</span>
                                <span class="day-type-text">Вихідний</span>
                            </button>
                            <button class="day-type-option" data-type="workday">
                                <span class="day-type-icon">💼</span>
                                <span class="day-type-text">Робочий</span>
                            </button>
                            <button class="day-type-option" data-type="vacation">
                                <span class="day-type-icon">✈️</span>
                                <span class="day-type-text">Відпустка</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <button class="generate-btn" id="generateBtn">
                    <i class="fas fa-magic" id="generateIcon"></i>
                    <span id="generateText">Створити ідеальний день</span>
                    <div class="loading-spinner" id="loadingSpinner" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                </button>
            </div>
        </section>

        <!-- Selected Options Display -->
        <section class="selected-options" id="selectedOptions">
            <div class="option-tags" id="optionTags"></div>
        </section>

        <!-- Generated Plan -->
        <section class="plan-section" id="planSection">
            <div class="plan-container" id="planContainer">
                <div class="welcome-message">
                    <i class="fas fa-calendar-day"></i>
                    <h2>Готовий створити твій ідеальний день?</h2>
                    <p>Опиши свої побажання або вибери готові опції з меню</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <script src="index.js"></script>
</body>
</html>
